<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GymFit Pro - Manajemen Gym & Fitness</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0b0f1c; color: #eef2ff; }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
        }
        .login-card {
            background: #1e293b;
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        .login-card h2 { text-align: center; margin-bottom: 8px; font-weight: 700; }
        .login-card p { text-align: center; color: #94a3b8; margin-bottom: 28px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .btn-login {
            width: 100%;
            background: #f97316;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-login:hover { background: #ea580c; }
        .register-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .register-link a { color: #f97316; text-decoration: none; cursor: pointer; }
        .app-container { display: none; }
        .sidebar {
            width: 280px;
            background: #0f172a;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            border-right: 1px solid #1e293b;
            transition: 0.3s;
            z-index: 100;
        }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid #1e293b; }
        .sidebar-header h3 { font-weight: 800; font-size: 22px; }
        .sidebar-header span { font-size: 12px; color: #f97316; }
        .nav-menu { padding: 20px 0; }
        .nav-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #cbd5e1;
        }
        .nav-item i { width: 24px; }
        .nav-item:hover, .nav-item.active { background: #1e293b; color: #f97316; }
        .main-content { margin-left: 280px; padding: 24px 32px; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            background: #0f172a;
            padding: 12px 24px;
            border-radius: 48px;
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .logout-btn { background: #dc2626; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 14px; }
        .card { background: #1e293b; border-radius: 24px; padding: 20px; margin-bottom: 24px; border: 1px solid #334155; }
        .card-header { font-size: 20px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #334155; }
        button { background: #f97316; border: none; padding: 6px 14px; border-radius: 30px; color: white; cursor: pointer; font-weight: 500; }
        button.secondary { background: #334155; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #0f172a; border-radius: 24px; padding: 20px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: 800; color: #f97316; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); position: fixed; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }
        .badge-success { background: #22c55e; padding: 4px 10px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .badge-pending { background: #eab308; color: black; padding: 4px 10px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content { background: #1e293b; border-radius: 32px; padding: 30px; max-width: 450px; width: 90%; }
        .trainer-card { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .trainer-card-item { background: #0f172a; border-radius: 20px; padding: 16px; flex: 1; min-width: 200px; }
        .trainer-name { font-size: 18px; font-weight: bold; color: #f97316; }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-container">
    <div class="login-card">
        <h2><i class="fas fa-dumbbell"></i> GymFit Pro</h2>
        <p>Login Member / Admin</p>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="member / admin">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="******">
        </div>
        <div class="input-group">
            <label>Login Sebagai</label>
            <select id="loginRole">
                <option value="member">Member</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <button class="btn-login" id="doLoginBtn"><i class="fas fa-sign-in-alt"></i> Masuk</button>
        <div class="register-link">Belum punya akun member? <a id="showRegisterBtn">Daftar Sekarang</a></div>
        <div class="register-link" style="font-size:12px; margin-top:10px;">Demo Member: andi/andi123 | Admin: admin/admin123</div>
    </div>
</div>

<!-- MODAL REGISTRASI MEMBER -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-user-plus"></i> Pendaftaran Member</h3>
        <div class="input-group"><input type="text" id="regName" placeholder="Nama Lengkap"></div>
        <div class="input-group"><input type="text" id="regUsername" placeholder="Username"></div>
        <div class="input-group"><input type="password" id="regPassword" placeholder="Password"></div>
        <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
        <div class="input-group">
            <select id="regPackage">
                <option value="Basic">Basic - Rp150.000/bln</option>
                <option value="Gold">Gold - Rp300.000/bln</option>
                <option value="Platinum">Platinum - Rp500.000/bln</option>
            </select>
        </div>
        <button id="doRegisterBtn" class="btn-login">Daftar</button>
        <button id="closeRegisterBtn" class="btn-login" style="background:#475569; margin-top:8px;">Batal</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="appContainer" class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h3>GYMFIT PRO</h3><span>Manajemen Fitness</span></div>
        <div class="nav-menu" id="navMenu"></div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <div><i class="fas fa-bars" id="menuToggle" style="cursor:pointer;"></i> <span id="pageTitle">Dashboard</span></div>
            <div class="user-info"><span id="userDisplay"></span> <div class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</div></div>
        </div>
        <div id="contentArea"></div>
    </div>
</div>

<script>
    // ======================= DATA STORAGE =======================
    let gymData = {
        members: [],     // {id, name, username, password, email, package, statusPayment, joinDate}
        trainers: [],    // {id, name, expertise, description, phone}
        schedules: [],   // {id, day, time, className, trainerName}
        payments: [],    // {id, memberId, amount, package, status, date}
        attendances: []  // {id, memberId, date, checkinTime}
    };

    function generateId(arr) { return arr.length ? Math.max(...arr.map(i=>i.id)) + 1 : 1; }
    function saveData() { localStorage.setItem('gymfit_data', JSON.stringify(gymData)); }

    function loadData() {
        const stored = localStorage.getItem('gymfit_data');
        if (stored) {
            gymData = JSON.parse(stored);
        } else {
            // Data default
            gymData.members = [
                { id: 1, name: "Andi Setiawan", username: "andi", password: "andi123", email: "andi@mail.com", package: "Gold", statusPayment: "active", joinDate: "2025-02-01" },
                { id: 2, name: "Budi Santoso", username: "budi", password: "budi123", email: "budi@mail.com", package: "Basic", statusPayment: "pending", joinDate: "2025-02-10" }
            ];
            gymData.trainers = [
                { id: 1, name: "Coach Alex", expertise: "Bodybuilding & Strength", description: "Certified personal trainer dengan 10 tahun pengalaman, spesialis pembentukan otot dan program kekuatan.", phone: "08123456789" },
                { id: 2, name: "Coach Bella", expertise: "Yoga & Pilates", description: "Instruktur yoga bersertifikat, membantu fleksibilitas, keseimbangan, dan relaksasi mental.", phone: "08129876543" }
            ];
            gymData.schedules = [
                { id: 1, day: "Senin", time: "07:00 - 08:30", className: "HIIT Training", trainerName: "Coach Alex" },
                { id: 2, day: "Rabu", time: "16:00 - 17:30", className: "Yoga Flow", trainerName: "Coach Bella" },
                { id: 3, day: "Jumat", time: "18:00 - 19:30", className: "Strength Class", trainerName: "Coach Alex" },
                { id: 4, day: "Sabtu", time: "09:00 - 10:30", className: "Pilates", trainerName: "Coach Bella" }
            ];
            gymData.payments = [
                { id: 1, memberId: 1, amount: 300000, package: "Gold", status: "confirmed", date: "2025-02-01" },
                { id: 2, memberId: 2, amount: 150000, package: "Basic", status: "pending", date: "2025-02-10" }
            ];
            gymData.attendances = [
                { id: 1, memberId: 1, date: "2025-02-15", checkinTime: "08:10" },
                { id: 2, memberId: 1, date: "2025-02-17", checkinTime: "17:20" }
            ];
            saveData();
        }
    }

    let currentUser = null; // { role, id, username, name }
    let currentNav = 'dashboard';

    // ======================= AUTH =======================
    function login(username, password, role) {
        if (role === 'admin') {
            if (username === 'admin' && password === 'admin123') {
                currentUser = { role: 'admin', username: 'admin', name: 'Administrator' };
                return true;
            }
            return false;
        } else {
            const member = gymData.members.find(m => m.username === username && m.password === password);
            if (member) {
                currentUser = { role: 'member', id: member.id, username: member.username, name: member.name };
                return true;
            }
            return false;
        }
    }

    function registerMember(name, username, password, email, pkg) {
        if (!name || !username || !password || !email || !pkg) return false;
        if (gymData.members.some(m => m.username === username)) return false;
        const newId = generateId(gymData.members);
        const newMember = {
            id: newId, name, username, password, email,
            package: pkg,
            statusPayment: 'pending',
            joinDate: new Date().toISOString().slice(0,10)
        };
        gymData.members.push(newMember);
        let amount = pkg === 'Basic' ? 150000 : (pkg === 'Gold' ? 300000 : 500000);
        gymData.payments.push({
            id: generateId(gymData.payments),
            memberId: newId,
            amount, package: pkg,
            status: 'pending',
            date: new Date().toISOString().slice(0,10)
        });
        saveData();
        return true;
    }

    // ======================= RENDER APP =======================
    function renderApp() {
        if (!currentUser) return;
        const isAdmin = currentUser.role === 'admin';
        const menuItems = isAdmin ? [
            { id: 'dashboard', icon: 'fa-chart-line', label: 'Dashboard Statistik' },
            { id: 'trainers', icon: 'fa-chalkboard-user', label: 'Informasi Pelatih' },
            { id: 'schedules', icon: 'fa-calendar-alt', label: 'Jadwal Latihan' },
            { id: 'packages', icon: 'fa-tags', label: 'Paket Membership' },
            { id: 'payments', icon: 'fa-credit-card', label: 'Verifikasi Pembayaran' },
            { id: 'attendance', icon: 'fa-fingerprint', label: 'Absensi Member' },
            { id: 'reports', icon: 'fa-file-alt', label: 'Laporan Keanggotaan' }
        ] : [
            { id: 'dashboard', icon: 'fa-chart-simple', label: 'Dashboard Saya' },
            { id: 'trainers', icon: 'fa-chalkboard-user', label: 'Info Pelatih' },
            { id: 'schedules', icon: 'fa-calendar-alt', label: 'Jadwal Latihan' },
            { id: 'packages', icon: 'fa-tags', label: 'Paket Membership' },
            { id: 'myPayments', icon: 'fa-credit-card', label: 'Pembayaran Saya' },
            { id: 'attendanceMember', icon: 'fa-check-circle', label: 'Absensi' }
        ];
        const navMenu = document.getElementById('navMenu');
        navMenu.innerHTML = menuItems.map(item => `<div class="nav-item ${currentNav === item.id ? 'active' : ''}" data-nav="${item.id}"><i class="fas ${item.icon}"></i> ${item.label}</div>`).join('');
        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', () => { currentNav = el.dataset.nav; renderApp(); });
        });
        const content = document.getElementById('contentArea');
        if (isAdmin) renderAdminContent(content);
        else renderMemberContent(content);
        document.getElementById('userDisplay').innerHTML = `<i class="fas fa-user-circle"></i> ${currentUser.name}`;
        const title = menuItems.find(i => i.id === currentNav)?.label || 'Dashboard';
        document.getElementById('pageTitle').innerText = title;
    }

    // ======================= ADMIN CONTENT =======================
    function renderAdminContent(container) {
        if (currentNav === 'dashboard') {
            const totalMembers = gymData.members.length;
            const activeMembers = gymData.members.filter(m => m.statusPayment === 'active').length;
            const totalIncome = gymData.payments.filter(p => p.status === 'confirmed').reduce((s,p) => s + p.amount, 0);
            const totalAttendance = gymData.attendances.length;
            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number">${totalMembers}</div><div>Total Member</div></div>
                    <div class="stat-card"><div class="stat-number">${activeMembers}</div><div>Member Aktif</div></div>
                    <div class="stat-card"><div class="stat-number">Rp ${totalIncome.toLocaleString()}</div><div>Pendapatan</div></div>
                    <div class="stat-card"><div class="stat-number">${totalAttendance}</div><div>Total Kehadiran</div></div>
                </div>
                <div class="card"><canvas id="memberChart" style="max-height:300px;"></canvas></div>
                <div class="card"><canvas id="attendanceChart" style="max-height:300px;"></canvas></div>
            `;
            const packages = ['Basic','Gold','Platinum'];
            const counts = packages.map(p => gymData.members.filter(m => m.package === p).length);
            new Chart(document.getElementById('memberChart'), { type:'bar', data:{ labels:packages, datasets:[{ label:'Jumlah Member', data:counts, backgroundColor:'#f97316' }] } });
            const months = [];
            const attendCounts = [];
            for (let i = 5; i >= 0; i--) {
                let d = new Date(); d.setMonth(d.getMonth() - i);
                let month = d.toISOString().slice(0,7);
                months.push(month);
                attendCounts.push(gymData.attendances.filter(a => a.date.startsWith(month)).length);
            }
            new Chart(document.getElementById('attendanceChart'), { type:'line', data:{ labels:months, datasets:[{ label:'Kehadiran per Bulan', data:attendCounts, borderColor:'#f97316' }] } });
        } 
        else if (currentNav === 'trainers') {
            container.innerHTML = `<div class="card"><div class="card-header">Informasi Pelatih</div>
                <div class="trainer-card">
                    ${gymData.trainers.map(t => `
                        <div class="trainer-card-item">
                            <div class="trainer-name"><i class="fas fa-user"></i> ${t.name}</div>
                            <div><i class="fas fa-dumbbell"></i> <strong>Keahlian:</strong> ${t.expertise}</div>
                            <div><i class="fas fa-info-circle"></i> ${t.description}</div>
                            <div><i class="fas fa-phone"></i> ${t.phone}</div>
                        </div>
                    `).join('')}
                </div>
                <button id="addTrainerBtn" class="secondary">Tambah Pelatih (Demo)</button></div>`;
            document.getElementById('addTrainerBtn')?.addEventListener('click', () => alert("Fitur tambah pelatih hanya untuk demo."));
        }
        else if (currentNav === 'schedules') {
            container.innerHTML = `<div class="card"><div class="card-header">Jadwal Latihan</div>
                <table><thead><tr><th>Hari</th><th>Jam</th><th>Kelas</th><th>Pelatih</th></tr></thead>
                <tbody>${gymData.schedules.map(s => `<tr><td>${s.day}</td><td>${s.time}</td><td>${s.className}</td><td>${s.trainerName}</td></tr>`).join('')}</tbody></table>
                <button id="addScheduleBtn" class="secondary">Tambah Jadwal (Demo)</button></div>`;
            document.getElementById('addScheduleBtn')?.addEventListener('click', () => alert("Fitur tambah jadwal untuk admin."));
        }
        else if (currentNav === 'packages') {
            const packages = [{ name:'Basic', price:150000, desc:'Akses dasar, jam terbatas' }, { name:'Gold', price:300000, desc:'Akses penuh, free trial kelas' }, { name:'Platinum', price:500000, desc:'Akses VIP + personal trainer 1x/minggu' }];
            container.innerHTML = `<div class="card"><div class="card-header">Paket Membership</div>
                <table><thead><tr><th>Paket</th><th>Harga/Bulan</th><th>Fitur</th></tr></thead>
                <tbody>${packages.map(p => `<tr><td>${p.name}</td><td>Rp ${p.price.toLocaleString()}</td><td>${p.desc}</td></tr>`).join('')}</tbody></table></div>`;
        }
        else if (currentNav === 'payments') {
            const pending = gymData.payments.filter(p => p.status === 'pending');
            container.innerHTML = `<div class="card"><div class="card-header">Verifikasi Pembayaran</div>
                <table><thead><tr><th>Member</th><th>Paket</th><th>Jumlah</th><th>Tanggal</th><th>Aksi</th></tr></thead>
                <tbody>${pending.map(p => {
                    const member = gymData.members.find(m => m.id === p.memberId);
                    return `<tr><td>${member?.name || '-'}</td><td>${p.package}</td><td>Rp ${p.amount.toLocaleString()}</td><td>${p.date}</td>
                    <td><button class="confirmPay" data-id="${p.id}">Konfirmasi</button></td></tr>`;
                }).join('')}</tbody></table></div>`;
            document.querySelectorAll('.confirmPay').forEach(btn => {
                btn.addEventListener('click', () => {
                    let payId = parseInt(btn.dataset.id);
                    let payment = gymData.payments.find(p => p.id === payId);
                    if (payment) {
                        payment.status = 'confirmed';
                        let member = gymData.members.find(m => m.id === payment.memberId);
                        if (member) member.statusPayment = 'active';
                        saveData();
                        renderAdminContent(container);
                    }
                });
            });
        }
        else if (currentNav === 'attendance') {
            container.innerHTML = `<div class="card"><div class="card-header">Riwayat Absensi Member</div>
                <table><thead><tr><th>Member</th><th>Tanggal</th><th>Jam Check-in</th></tr></thead>
                <tbody>${gymData.attendances.map(a => {
                    const member = gymData.members.find(m => m.id === a.memberId);
                    return `<tr><td>${member?.name || '-'}</td><td>${a.date}</td><td>${a.checkinTime}</td></tr>`;
                }).join('')}</tbody></table></div>`;
        }
        else if (currentNav === 'reports') {
            const active = gymData.members.filter(m => m.statusPayment === 'active').length;
            const income = gymData.payments.filter(p => p.status === 'confirmed').reduce((s,p) => s + p.amount, 0);
            const memberPerPackage = { Basic:0, Gold:0, Platinum:0 };
            gymData.members.forEach(m => memberPerPackage[m.package]++);
            container.innerHTML = `<div class="card"><h3>Laporan Keanggotaan</h3>
                <p><strong>Total Member:</strong> ${gymData.members.length}</p>
                <p><strong>Member Aktif:</strong> ${active}</p>
                <p><strong>Total Pendapatan Terkonfirmasi:</strong> Rp ${income.toLocaleString()}</p>
                <p><strong>Total Kehadiran:</strong> ${gymData.attendances.length}</p>
                <h4>Distribusi Paket:</h4>
                <ul>${Object.entries(memberPerPackage).map(([pkg, cnt]) => `<li>${pkg}: ${cnt} member</li>`).join('')}</ul>
                <button id="exportReport">Export Laporan (Simulasi)</button></div>`;
            document.getElementById('exportReport')?.addEventListener('click', () => alert("Fitur export laporan akan menghasilkan file CSV."));
        }
    }

    // ======================= MEMBER CONTENT =======================
    function renderMemberContent(container) {
        const member = gymData.members.find(m => m.id === currentUser.id);
        if (!member) return;
        if (currentNav === 'dashboard') {
            const attendCount = gymData.attendances.filter(a => a.memberId === currentUser.id).length;
            const lastPayment = gymData.payments.filter(p => p.memberId === currentUser.id).sort((a,b)=>b.id - a.id)[0];
            container.innerHTML = `<div class="card"><h3>Selamat Datang, ${member.name}</h3>
                <p>Paket: <strong>${member.package}</strong> | Status: <span class="badge-${member.statusPayment === 'active' ? 'success' : 'pending'}">${member.statusPayment}</span></p>
                <p>Total Kehadiran Anda: ${attendCount} kali</p>
                <p>Status Pembayaran Terakhir: ${lastPayment ? (lastPayment.status === 'confirmed' ? 'Lunas' : 'Menunggu Verifikasi') : 'Belum ada pembayaran'}</p>
                </div><div class="card"><h4>Tips Fitness Hari Ini</h4><p>Jangan lupa minum air putih yang cukup sebelum dan sesudah latihan!</p></div>`;
        }
        else if (currentNav === 'trainers') {
            container.innerHTML = `<div class="card"><div class="card-header">Informasi Pelatih</div>
                <div class="trainer-card">
                    ${gymData.trainers.map(t => `
                        <div class="trainer-card-item">
                            <div class="trainer-name"><i class="fas fa-user"></i> ${t.name}</div>
                            <div><i class="fas fa-dumbbell"></i> <strong>Keahlian:</strong> ${t.expertise}</div>
                            <div><i class="fas fa-info-circle"></i> ${t.description}</div>
                            <div><i class="fas fa-phone"></i> ${t.phone}</div>
                        </div>
                    `).join('')}
                </div></div>`;
        }
        else if (currentNav === 'schedules') {
            container.innerHTML = `<div class="card"><div class="card-header">Jadwal Latihan</div>
                <table><thead><tr><th>Hari</th><th>Jam</th><th>Kelas</th><th>Pelatih</th></tr></thead>
                <tbody>${gymData.schedules.map(s => `<tr><td>${s.day}</td><td>${s.time}</td><td>${s.className}</td><td>${s.trainerName}</td></tr>`).join('')}</tbody></table></div>`;
        }
        else if (currentNav === 'packages') {
            const packages = [{ name:'Basic', price:150000, desc:'Akses dasar, jam terbatas' }, { name:'Gold', price:300000, desc:'Akses penuh, free trial kelas' }, { name:'Platinum', price:500000, desc:'Akses VIP + personal trainer 1x/minggu' }];
            container.innerHTML = `<div class="card"><div class="card-header">Paket Membership</div>
                <table><thead><tr><th>Paket</th><th>Harga/Bulan</th><th>Fitur</th></tr></thead>
                <tbody>${packages.map(p => `<tr><td>${p.name}</td><td>Rp ${p.price.toLocaleString()}</td><td>${p.desc}</td></tr>`).join('')}</tbody></table>
                <button id="upgradeBtn" class="secondary">Upgrade Paket (Simulasi)</button></div>`;
            document.getElementById('upgradeBtn')?.addEventListener('click', () => alert("Silakan hubungi admin untuk upgrade paket."));
        }
        else if (currentNav === 'myPayments') {
            const myPayments = gymData.payments.filter(p => p.memberId === currentUser.id).sort((a,b)=>b.id - a.id);
            container.innerHTML = `<div class="card"><div class="card-header">Riwayat Pembayaran Saya</div>
                <table><thead><tr><th>Paket</th><th>Jumlah</th><th>Tanggal</th><th>Status</th></tr></thead>
                <tbody>${myPayments.map(p => `<tr><td>${p.package}</td><td>Rp ${p.amount.toLocaleString()}</td><td>${p.date}</td><td><span class="badge-${p.status === 'confirmed' ? 'success' : 'pending'}">${p.status === 'confirmed' ? 'Lunas' : 'Pending'}</span></td></tr>`).join('')}</tbody></table>
                <button id="payNowBtn">Lakukan Pembayaran Baru</button></div>`;
            document.getElementById('payNowBtn')?.addEventListener('click', () => {
                let amount = member.package === 'Basic' ? 150000 : (member.package === 'Gold' ? 300000 : 500000);
                gymData.payments.push({
                    id: generateId(gymData.payments),
                    memberId: member.id,
                    amount,
                    package: member.package,
                    status: 'pending',
                    date: new Date().toISOString().slice(0,10)
                });
                member.statusPayment = 'pending';
                saveData();
                alert("Pembayaran baru telah diajukan, menunggu konfirmasi admin.");
                renderMemberContent(container);
            });
        }
        else if (currentNav === 'attendanceMember') {
            const today = new Date().toISOString().slice(0,10);
            const already = gymData.attendances.some(a => a.memberId === currentUser.id && a.date === today);
            container.innerHTML = `<div class="card"><h3>Absensi Hari Ini</h3>
                <button id="checkinBtn">Check-in Sekarang</button><div id="attMsg"></div>
                <h4>Riwayat Absensi Anda</h4>
                <table><thead><tr><th>Tanggal</th><th>Jam Check-in</th></tr></thead>
                <tbody>${gymData.attendances.filter(a => a.memberId === currentUser.id).map(a => `<tr><td>${a.date}</td><td>${a.checkinTime}</td></tr>`).join('')}</tbody></table></div>`;
            document.getElementById('checkinBtn')?.addEventListener('click', () => {
                if (already) { document.getElementById('attMsg').innerText = "Anda sudah absen hari ini!"; return; }
                const now = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
                gymData.attendances.push({
                    id: generateId(gymData.attendances),
                    memberId: currentUser.id,
                    date: today,
                    checkinTime: now
                });
                saveData();
                document.getElementById('attMsg').innerHTML = "✅ Absen berhasil! Selamat berolahraga.";
                renderMemberContent(container);
            });
        }
    }

    // ======================= EVENT LISTENERS =======================
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        // Login
        document.getElementById('doLoginBtn').addEventListener('click', () => {
            const uname = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const role = document.getElementById('loginRole').value;
            if (login(uname, pass, role)) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                renderApp();
            } else {
                alert("Login gagal! Periksa username/password.\nMember: andi/andi123 atau budi/budi123\nAdmin: admin/admin123");
            }
        });
        // Register modal
        const modal = document.getElementById('registerModal');
        document.getElementById('showRegisterBtn').addEventListener('click', (e) => {
            e.preventDefault();
            modal.style.display = 'flex';
        });
        document.getElementById('closeRegisterBtn').addEventListener('click', () => modal.style.display = 'none');
        document.getElementById('doRegisterBtn').addEventListener('click', () => {
            const name = document.getElementById('regName').value.trim();
            const uname = document.getElementById('regUsername').value.trim();
            const pass = document.getElementById('regPassword').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pkg = document.getElementById('regPackage').value;
            if (!name || !uname || !pass || !email || !pkg) { alert("Isi semua data!"); return; }
            if (registerMember(name, uname, pass, email, pkg)) {
                alert("Pendaftaran berhasil! Silakan login.");
                modal.style.display = 'none';
                document.getElementById('loginUsername').value = uname;
                document.getElementById('loginPassword').value = pass;
                document.getElementById('loginRole').value = 'member';
            } else {
                alert("Username sudah terdaftar!");
            }
        });
        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            currentUser = null;
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
        });
        // Sidebar toggle
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });
    });
</script>
</body>
</html>
